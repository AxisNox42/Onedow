<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiNILL 120일 스팀 데모 로드맵</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #7d8590;
    --blue: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #e3b341;
    --pink: #ff7b72;
    --teal: #39d353;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
  }

  .header h1 { font-size: 17px; font-weight: 700; color: var(--blue); }
  .header-sub { font-size: 12px; color: var(--muted); }

  .progress-wrap { display: flex; align-items: center; gap: 12px; }

  .progress-bar {
    flex: 1; height: 5px;
    background: var(--surface2);
    border-radius: 3px; overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--blue));
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-label {
    font-size: 12px; color: var(--muted);
    white-space: nowrap; min-width: 130px; text-align: right;
  }

  /* ── Stats ── */
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; text-align: center;
  }

  .stat-num { font-size: 24px; font-weight: 700; color: var(--blue); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── Phase ── */
  .phase {
    margin-bottom: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }

  .phase-header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
    background: var(--surface2);
    cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .phase-header:hover { background: #2d333b; }

  .phase-left { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }

  .phase-badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
    color: #000; letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .phase-days { font-size: 11px; color: var(--muted); font-weight: 400; }

  .phase-right { display: flex; align-items: center; gap: 12px; }

  .phase-mini-bar {
    width: 72px; height: 4px;
    background: var(--border);
    border-radius: 2px; overflow: hidden;
  }

  .phase-mini-fill { height: 100%; border-radius: 2px; transition: width 0.3s; width: 0%; }
  .phase-count { font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }
  .phase-arrow { font-size: 10px; color: var(--muted); transition: transform 0.2s; }
  .phase-arrow.up { transform: rotate(180deg); }

  /* ── Day Items ── */
  .phase-body { display: block; }
  .phase-body.hidden { display: none; }

  .day-item {
    display: flex; align-items: flex-start;
    gap: 12px; padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }

  .day-item:last-child { border-bottom: none; }
  .day-item:hover { background: var(--surface2); }
  .day-item.done { opacity: 0.4; }
  .day-item.done .task-text { text-decoration: line-through; color: var(--muted); }

  .day-item.today {
    background: rgba(88, 166, 255, 0.06);
    border-left: 3px solid var(--blue);
  }

  .day-item.today .day-num::after {
    content: ' ← TODAY';
    color: var(--blue); font-weight: 700; font-size: 9px;
  }

  .day-checkbox {
    width: 15px; height: 15px; min-width: 15px;
    margin-top: 4px; cursor: pointer;
    accent-color: var(--green);
  }

  .day-meta { flex: 1; }
  .day-num { font-size: 10px; color: var(--muted); margin-bottom: 1px; }
  .task-text { font-size: 13px; line-height: 1.5; }

  .tag {
    display: inline-block;
    font-size: 9px; font-weight: 700;
    padding: 1px 6px; border-radius: 4px;
    margin-right: 5px; vertical-align: middle;
    color: #000;
  }

  .tag-design { background: #bc8cff; color: #fff; }
  .tag-code   { background: #58a6ff; color: #000; }
  .tag-art    { background: #e3b341; color: #000; }
  .tag-test   { background: #3fb950; color: #000; }
  .tag-steam  { background: #1a9fff; color: #fff; }
  .tag-del    { background: #f85149; color: #fff; }

  .day-date {
    font-size: 10px; color: var(--muted);
    white-space: nowrap; padding-top: 4px;
  }

  /* Phase color map */
  .p1 .phase-badge { background: #f85149; }
  .p1 .phase-mini-fill { background: #f85149; }

  .p2 .phase-badge { background: #e3b341; }
  .p2 .phase-mini-fill { background: #e3b341; }

  .p3 .phase-badge { background: #bc8cff; }
  .p3 .phase-mini-fill { background: #bc8cff; }

  .p4 .phase-badge { background: #58a6ff; }
  .p4 .phase-mini-fill { background: #58a6ff; }

  .p5 .phase-badge { background: #3fb950; }
  .p5 .phase-mini-fill { background: #3fb950; }

  .p6 .phase-badge { background: #1a9fff; }
  .p6 .phase-mini-fill { background: #1a9fff; }

  .p7 .phase-badge { background: #39d353; }
  .p7 .phase-mini-fill { background: #39d353; }

  /* Legend */
  .legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 11px; color: var(--muted);
  }

  .legend-item { display: flex; align-items: center; gap: 5px; }

  .footer-actions { text-align: center; margin-top: 32px; }

  .btn-reset {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 8px 20px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: all 0.2s;
  }

  .btn-reset:hover { border-color: var(--red); color: var(--red); }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .header { padding: 14px 16px; }
    .phase-mini-bar { display: none; }
    .legend { display: none; }
  }
</style>
</head>

const TAG_MAP = {
  design: 'tag-design',
  code:   'tag-code',
  art:    'tag-art',
  test:   'tag-test',
  steam:  'tag-steam',
  del:    'tag-del',
};

const TAG_LABEL = {
  design: '기획',
  code:   '코드',
  art:    '아트',
  test:   '테스트',
  steam:  'Steam',
  del:    '삭제',
};

function dayDate(n) {
  const d = new Date(START);
  d.setDate(d.getDate() + n - 1);
  return d;
}

function fmtDate(d) {
  return d.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short' });
}

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); }
  catch { return {}; }
}

function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

let checked = load();

function todayDayNum() {
  const today = new Date(); today.setHours(0,0,0,0);
  const s = new Date(START); s.setHours(0,0,0,0);
  const diff = Math.round((today - s) / 86400000) + 1;
  return (diff >= 1 && diff <= TOTAL) ? diff : -1;
}

function buildAll() {
  const container = document.getElementById('phaseContainer');
  container.innerHTML = '';
  let dayN = 1;
  const today = todayDayNum();

  PHASES.forEach(phase => {
    const total = phase.tasks.length;
    const startDay = dayN;
    const endDay = dayN + total - 1;
    let done = 0;
    for (let i = startDay; i <= endDay; i++) if (checked[`d${i}`]) done++;

    const div = document.createElement('div');
    div.className = `phase ${phase.cls}`;
    div.id = `phase_${phase.id}`;

    div.innerHTML = `
      <div class="phase-header" onclick="togglePhase(${phase.id})">
        <div class="phase-left">
          <span class="phase-badge">Phase ${phase.id}</span>
          ${phase.name}
          <span class="phase-days">Day ${startDay}–${endDay}</span>
        </div>
        <div class="phase-right">
          <div class="phase-mini-bar">
            <div class="phase-mini-fill" id="pmf_${phase.id}" style="width:${total>0?Math.round(done/total*100):0}%"></div>
          </div>
          <span class="phase-count" id="pc_${phase.id}">${done}/${total}</span>
          <span class="phase-arrow up" id="pa_${phase.id}">▼</span>
        </div>
      </div>
      <div class="phase-body" id="pb_${phase.id}">
        ${phase.tasks.map((t, i) => {
          const n = startDay + i;
          const isDone = !!checked[`d${n}`];
          const isToday = n === today;
          const tagCls = TAG_MAP[t.tag] || '';
          const tagLbl = TAG_LABEL[t.tag] || '';
          return `
            <div class="day-item${isDone?' done':''}${isToday?' today':''}" id="di_${n}">
              <input type="checkbox" class="day-checkbox" ${isDone?'checked':''} onchange="toggle(${n},this)">
              <div class="day-meta">
                <div class="day-num">Day ${n}</div>
                <div class="task-text"><span class="tag ${tagCls}">${tagLbl}</span>${t.text}</div>
              </div>
              <div class="day-date">${fmtDate(dayDate(n))}</div>
            </div>`;
        }).join('')}
      </div>
    `;

    container.appendChild(div);
    dayN += total;
  });

  const endD = dayDate(TOTAL);
  document.getElementById('dateRange').textContent =
    `${fmtDate(START)} ~ ${fmtDate(endD)}`;

  updateGlobal();
}

function togglePhase(id) {
  const body = document.getElementById(`pb_${id}`);
  const arrow = document.getElementById(`pa_${id}`);
  body.classList.toggle('hidden');
  arrow.classList.toggle('up');
}

function toggle(n, cb) {
  if (cb.checked) checked[`d${n}`] = 1;
  else delete checked[`d${n}`];
  save(checked);

  const item = document.getElementById(`di_${n}`);
  item.classList.toggle('done', cb.checked);

  updatePhase(n);
  updateGlobal();
}

function updatePhase(dayN) {
  let start = 1;
  for (const phase of PHASES) {
    const total = phase.tasks.length;
    const end = start + total - 1;
    if (dayN >= start && dayN <= end) {
      let done = 0;
      for (let i = start; i <= end; i++) if (checked[`d${i}`]) done++;
      document.getElementById(`pmf_${phase.id}`).style.width = Math.round(done/total*100) + '%';
      document.getElementById(`pc_${phase.id}`).textContent = `${done}/${total}`;
      break;
    }
    start += total;
  }
}

function updateGlobal() {
  const done = Object.keys(checked).length;
  const pct = Math.round(done / TOTAL * 100);

  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pLabel').textContent = `${done} / ${TOTAL} 완료 (${pct}%)`;
  document.getElementById('sDone').textContent = done;
  document.getElementById('sRemain').textContent = TOTAL - done;

  let streak = 0;
  for (let i = 1; i <= TOTAL; i++) {
    if (checked[`d${i}`]) streak++;
    else break;
  }
  document.getElementById('sStreak').textContent = streak;

  const end = dayDate(TOTAL); end.setHours(0,0,0,0);
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.ceil((end - now) / 86400000);
  document.getElementById('sDday').textContent =
    diff > 0 ? `D-${diff}` : diff === 0 ? 'D-Day!' : '완료!';
}

function resetAll() {
  if (!confirm('모든 체크를 초기화할까요?')) return;
  checked = {}; save(checked); buildAll();
}

buildAll();
</script>
