name: macOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fonts
        run: |
          test -f WiNILL/Resource/Font/Jua-Regular.ttf
          test -f WiNILL/Resource/Font/KosugiMaru-Regular.ttf

      - name: Build GLFW (static, universal)
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git glfw-src
          cmake -S glfw-src -B glfw-src/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/glfw-install" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build glfw-src/build --config Release
          cmake --install glfw-src/build

      - name: Configure & build Onedow
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/glfw-install" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"

      - name: Verify binary
        run: |
          test -x build/WiNILL
          file build/WiNILL
          lipo -info build/WiNILL | tee /dev/stderr | grep -q 'arm64' || exit 1
          test -d build/Resource
          test -d build/Resource/Font

      - name: Package
        run: |
          ONEDOW=bin/Onedow
          mkdir -p "$ONEDOW/WindowsOS" "$ONEDOW/macOS"
          rm -rf "$ONEDOW/Resource"
          cp -R WiNILL/Resource "$ONEDOW/Resource"
          cp build/WiNILL "$ONEDOW/macOS/Onedow"
          chmod +x "$ONEDOW/macOS/Onedow"
          codesign --force --deep --sign - "$ONEDOW/macOS/Onedow" || true
          # Same manifest-based staging as the local release scripts.
          bash scripts/zip_onedow.sh
          ls -lh bin/Onedow.zip
          unzip -l bin/Onedow.zip | head -20

      - name: Verify package
        run: |
          # Only manifest items, and macOS/Onedow stored executable.
          python3 scripts/verify_package_zip.py bin/Onedow.zip --require macOS/Onedow
          zipinfo bin/Onedow.zip Onedow/macOS/Onedow

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Onedow-macOS
          path: bin/Onedow.zip
          if-no-files-found: error
