name: macOS Build

# 수동 실행(Actions 탭의 "Run workflow") + main 푸시 시 자동 빌드
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # macos-latest = Apple Silicon(arm64) 러너 → 줄이 짧음.
    # 여기서 universal(arm64 + x86_64) 로 빌드하면
    # Intel 맥·M칩 맥 모두 네이티브 실행 (Rosetta 불필요) = 단일 파일로 전부 호환
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fonts
        run: |
          test -f WiNILL/Font/Jua-Regular.ttf
          test -f WiNILL/Font/KosugiMaru-Regular.ttf

      # ── GLFW 를 정적(static) · 유니버설로 직접 빌드 ──
      #    → 최종 바이너리가 GLFW dylib 에 의존하지 않아 어디서나 실행 가능
      - name: Build GLFW (static, universal)
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git glfw-src
          cmake -S glfw-src -B glfw-src/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/glfw-install" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build glfw-src/build --config Release
          cmake --install glfw-src/build

      # ── 게임 빌드 (universal) ──
      - name: Configure & build Onedow
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/glfw-install" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release

      # ── 패키징 (바이너리 + 폰트) ──
      - name: Package
        run: |
          mkdir -p bin/Zip/Onedow/WindowsOS bin/Zip/Onedow/macOS
          cp build/WiNILL bin/Zip/Onedow/macOS/Onedow
          chmod +x bin/Zip/Onedow/macOS/Onedow
          codesign --force --deep --sign - bin/Zip/Onedow/macOS/Onedow || true
          cd bin/Zip && zip -r Onedow.zip Onedow

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onedow-macOS
          path: bin/Zip/Onedow.zip
