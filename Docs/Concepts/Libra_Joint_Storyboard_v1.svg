</defs><rect class="bg" width="1800" height="1100"/><text class="t1" x="30" y="56" text-anchor="start">LIBRA 보스 · 합동 패턴과 홀로 선 저울</text><text class="t2" x="30" y="92" text-anchor="start">합동 2종은 체력 격차로 갈리고 · 한쪽이 쓰러지면 남은 반쪽이 유산 패턴을 하나 가진다</text><text class="hv" x="30" y="140" text-anchor="start">합동 1 · 저울질 — 균형 상태 (격차 15%p 이하)</text><rect class="frame" x="30" y="155" width="420" height="320"/><text class="hw" x="48" y="189" text-anchor="start">① 정렬 · 0–1.2초</text><text class="p" x="48" y="217" text-anchor="start">둘이 양끝에 서고 축 안전 고리 표시</text><g transform="translate(30 155)"><rect class="d" x="20" y="82" width="380" height="210"/><use href="#sword" transform="translate(290.0 187.0) rotate(0) scale(0.3)"/><use href="#bow" transform="translate(130.0 187.0) rotate(0) scale(0.3)"/><path class="v" d="M148.0 187.0 270.0 187.0"/><circle class="b" cx="210.0" cy="187.0" r="28"/><path class="v" d="M210.0 181.0 216.0 187.0 210.0 193.0 204.0 187.0Z"/><path class="c" d="M270.0 229.0 283.0 242.0 270.0 255.0 257.0 242.0Z"/><circle class="c" cx="270.0" cy="242.0" r="3"/></g><rect class="frame" x="460" y="155" width="420" height="320"/><text class="hw" x="478" y="189" text-anchor="start">② 예고 · 1.2–2.0초</text><text class="p" x="478" y="217" text-anchor="start">축 중심 막대 윤곽 · 회전 방향 표시</text><g transform="translate(460 155)"><rect class="d" x="20" y="82" width="380" height="210"/><use href="#sword" transform="translate(285.17540966287265 214.3616114660535) rotate(0) scale(0.3)"/><use href="#bow" transform="translate(134.82459033712732 159.6383885339465) rotate(0) scale(0.3)"/><circle class="b" cx="210.0" cy="187.0" r="28"/><path class="b" d="M234.9 200.3 268.8 212.6 271.5 205.1 237.7 192.8Z"/><path class="b" d="M185.1 173.7 151.2 161.4 148.5 168.9 182.3 181.2Z"/><path class="g" d="M250.0 135.0Q290.0 157.0 300.0 181.0"/><path class="g" d="M294.5 176.6 300.0 181.0 300.7 174.0"/><path class="c" d="M210.0 174.0 223.0 187.0 210.0 200.0 197.0 187.0Z"/><circle class="c" cx="210.0" cy="187.0" r="3"/>