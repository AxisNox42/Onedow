48" y="584" text-anchor="start">저울대 기울기 · 무거운 쪽 가라앉음 예고</text><g transform="translate(30 522)"><rect class="d" x="20" y="82" width="380" height="210"/><use href="#sword" transform="translate(80 199.0) rotate(0) scale(0.3)"/><use href="#bow" transform="translate(340 169.0) rotate(0) scale(0.3)"/><path class="v" d="M100 199.0 320 169.0"/><path class="v" d="M210.0 184.0 220.0 208.0 200.0 208.0Z"/><path class="c" d="M290.0 224.0 303.0 237.0 290.0 250.0 277.0 237.0Z"/><circle class="c" cx="290.0" cy="237.0" r="3"/></g><rect class="frame" x="460" y="522" width="420" height="320"/><text class="hw" x="478" y="556" text-anchor="start">② 예고 · 1.5초</text><text class="p" x="478" y="584" text-anchor="start">경계선과 안쪽 등고선 표시 · 아직 피해 없음</text><g transform="translate(460 522)"><rect class="d" x="20" y="82" width="380" height="210"/><use href="#sword" transform="translate(80 199.0) rotate(0) scale(0.3)"/><use href="#bow" transform="translate(340 169.0) rotate(0) scale(0.3)"/><path class="v" d="M210.0 82 210.0 292"/><rect class="b" x="32" y="94" width="178.0" height="186"/><rect class="b" x="44" y="106" width="166.0" height="162"/><rect class="b" x="56" y="118" width="154.0" height="138"/><path class="c" d="M290.0 224.0 303.0 237.0 290.0 250.0 277.0 237.0Z"/><circle class="c" cx="290.0" cy="237.0" r="3"/></g><rect class="frame" x="890" y="522" width="420" height="320"/><text class="hw" x="908" y="556" text-anchor="start">③ 침강 · 2.0초</text><text class="p" x="908" y="584" text-anchor="start">무거운 쪽 반면 위험 · 경계 넘어 이동</text><g transform="translate(890 522)"><rect class="d" x="20" y="82" width="380" height="210"/><use href="#sword" transform="translate(80 199.0) rotate(0) scale(0.3)"/><use href="#bow" transform="translate(340 169.0) rotate(0) scale(0.3)"/><path class="w" d="M210.0 82 210.0 292"/><rect class="w" x="32" y="94" width="178.0" height="186"/><rect class="w" x="44" y="106" width="166.0" height="162"/><rect class="w" x="56" y="118" width="154.0" height="138"/><path class="g" d="M130 232 130 262"/><path class="g" d="M125.7 254.1 130.0 262.0 134.3 254.1"/><path class="c" d="M290.0 224.0 303.0 237.0 290.0 250.0 277.0 237.0Z"/><circle class="c" cx="290.0" cy="237.0" r="3"/></g><rect class="frame" x="1320" y="522" width="420" height="320"/><text class="hw" x="1338" y="556" text-anchor="start">④ 회복 · 1.2초</text><text class="p" x="1338" y="584" text-anchor="start">등고선 소멸 · 저울대 수평으로 복귀</text><g transform="translate(1320 522)"><rect class="d" x="20" y="82" width="380" height="210"/><use href="#sword" transform="translate(80 187.0) rotate(0) scale(0.3)"/><use href="#bow" transform="translate(340 187.0) rotate(0) scale(0.3)"/><path class="d" d="M100 187.0 320 187.0"/><path class="d" d="M210.0 187.0 220.0 211.0 200.0 211.0Z"/><path class="c" d="M290.0 224.0 303.0 237.0 290.0 250.0 277.0 237.0Z"/><circle class="c" cx="290.0" cy="237.0" r="3"/></g><rect class="frame" x="30" y="862" width="1740" height="200"/><text class="hw" x="52" y="900" text-anchor="start">홀로 선 저울 · 한쪽이 쓰러지면 저울대가 사라지고 남은 반쪽이 유산 패턴을 쓴다</text><use href="#sword" transform="translate(140 987) rotate(0) scale(0.35)" opacity="0.3"/><text class="p" x="140" y="1044" text-anchor="middle">검 먼저 격파</text><path class="g" d="M185 972 290 972"/><path class="g" d="M282.1 976.3 290.0 972.0 282.1 967.7"/><use href="#bow" transform="translate(340 987) rotate(0) scale(0.35)"/><text class="p" x="340" y="1044" text-anchor="middle">활 생존</text><path class="w" d="M478.3 971.0A18 18 0 1 1 461.7 971.0"/><path class="b" d="M454.3 1017.2A34 34 0 1 1 485.7 1017.2"/><text class="hb" x="530" y="962" text-anchor="start">활이 검의 「꽂기 파문」을 얻는다</text><text class="p" x="530" y="997" text-anchor="start">활 1 · 활 2 · 꽂기 파문</text><text class="p" x="530" y="1024" text-anchor="start">= 단독 패턴 3종</text><use href="#bow" transform="translate(1000 987) rotate(0) scale(0.35)" opacity="0.3"/><text class="p" x="1000" y="1044" text-anchor="middle">활 먼저 격파</text><path class="g" d="M1045 972 1150 972"/><path class="g" d="M1142.1 976.3 1150.0 972.0 1142.1 967.7"/><use href="#sword" transform="translate(1200 987) rotate(0) scale(0.35)"/><text class="p" x="1200" y="1044" text-anchor="middle">검 생존</text><path class="w" d="M1280 960 1310 987 1280 1017 1255 987Z"/><text class="hw" x="1345" y="962" text-anchor="start">검이 활의 「천칭 사변형」을 얻는다</text><text class="p" x="1345" y="997" text-anchor="start">검 1 · 검 2 · 천칭 사변형</text><text class="p" x="1345" y="1024" text-anchor="start">= 단독 패턴 3종</text><text class="s" x="900" y="1088" text-anchor="middle">합동 패턴은 저울대가 있을 때만 나온다 · 실제 게임 캡처가 아닌 설계 시안 · 시간은 플레이 검증 후 조정</text></svg>