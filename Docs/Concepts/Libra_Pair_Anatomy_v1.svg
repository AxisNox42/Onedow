<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 1100" width="1800" height="1100"><title>LIBRA 보스 쌍둥이 반쪽 구조</title><defs><style>
