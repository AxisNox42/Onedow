</defs><rect class="bg" width="1800" height="1100"/><text class="t1" x="30" y="56" text-anchor="start">LIBRA 보스 · 쌍둥이 반쪽 구조</text><text class="t2" x="30" y="92" text-anchor="start">검 0.5 + 활 0.5 · 저울대로 묶인 한 마리의 보스</text><rect class="frame" x="30" y="120" width="1100" height="650"/><text class="h" x="52" y="160" text-anchor="start">A. 균형 상태 · 두 반쪽이 저울대를 사이에 두고 선다</text><text class="p" x="52" y="188" text-anchor="start">체력 격차 15%p 이하 · 저울대가 수평</text><use href="#sword" transform="translate(330 450) rotate(0) scale(1.4)"/><use href="#bow" transform="translate(800 450) rotate(0) scale(1.4)"/><path class="v" d="M379 450 747 450"/><path class="v" d="M565 450 600.0 528 530.0 528Z"/><path class="v" d="M565 443 572 450 565 457 558 450Z"/><path class="v" d="M379 440 379 460"/><path class="v" d="M747 440 747 460"/><text class="hv" x="565" y="428" text-anchor="middle">저울대</text><text class="p" x="565" y="562" text-anchor="middle">받침점</text><text class="hw" x="330" y="625" text-anchor="middle">샤말리 · 검 0.5</text><text class="s" x="330" y="650" text-anchor="middle">ZUBENESCHAMALI</text><text class="p" x="330" y="678" text-anchor="middle">육각 몸체 · 몸과 떨어진 곧은 날</text><text class="hb" x="800" y="625" text-anchor="middle">제누비 · 활 0.5</text><text class="s" x="800" y="650" text-anchor="middle">ZUBENELGENUBI</text><text class="p" x="800" y="678" text-anchor="middle">원환 몸체 · 휜 활대와 화살</text><path class="c" d="M565 722 578 735 565 748 552 735Z"/><circle class="c" cx="565" cy="735" r="3"/><text class="p" x="590" y="741" text-anchor="start">플레이어는 두 반쪽 사이를 오간다</text><rect class="frame" x="1150" y="120" width="620" height="300"/><text class="hw" x="1172" y="160" text-anchor="start">B1. 균형 → 합동 패턴 「저울질」</text><text class="p" x="1172" y="186" text-anchor="start">저울대가 수평 · 둘이 같은 무게</text><use href="#sword" transform="translate(1260 305) rotate(0) scale(0.5)"/><use href="#bow" transform="translate(1660 305) rotate(0) scale(0.5)"/><path class="v" d="M1286 305 1632 305"/><path class="v" d="M1459 305 1479.0 351 1439.0 351Z"/><rect class="frame" x="1150" y="440" width="620" height="330"/><text class="hw" x="1172" y="480" text-anchor="start">B2. 기움 → 합동 패턴 「기운 저울」</text><text class="p" x="1172" y="506" text-anchor="start">격차 20%p 이상 · 체력이 많은 쪽이 가라앉는다</text><use href="#sword" transform="translate(1260 640) rotate(0) scale(0.5)"/><use href="#bow" transform="translate(1660 575) rotate(0) scale(0.5)"/><path class="v" d="M1286 640 1632 575"/><path class="v" d="M1459 605 1479.0 651 1439.0 651Z"/><path class="g" d="M1260 692 1260 728"/><path class="g" d="M1255.7 720.1 1260.0 728.0 1264.3 720.1"/><text class="p" x="1285" y="724" text-anchor="start">무거운 쪽</text><text class="s" x="1172" y="750" text-anchor="start">체력이 더 많은 쪽 = 무거운 쪽</text><rect class="frame" x="30" y="790" width="1740" height="290"/><text class="h" x="52" y="830" text-anchor="start">구분 기준</text><text class="hw" x="330" y="830" text-anchor="middle">몸체 · 육각 ↔ 원환</text><text class="hw" x="680" y="830" text-anchor="middle">무기 · 곧은 날 ↔ 휜 활대</text><text class="hw" x="1030" y="830" text-anchor="middle">거리 · 근접 ↔ 원거리</text><text class="hw" x="1450" y="830" text-anchor="middle">움직임 · 접근·이탈 ↔ 위치 이동</text><path class="w" d="M280 925 305 910 330 925 330 955 305 970 280 955Z"/><circle class="b" cx="390" cy="940" r="28"/><text class="p" x="305" y="1020" text-anchor="middle">샤말리</text><text class="p" x="390" y="1020" text-anchor="middle">제누비</text><path class="w" d="M640 980L640 900 650 925 640 980M630 925L640 910 650 925"/><path class="b" d="M700 980Q740 890 780 980M700 980L780 980"/><text class="p" x="645" y="1020" text-anchor="middle">날</text><text class="p" x="740" y="1020" text-anchor="middle">활대</text><use href="#sword" transform="translate(930 965) rotate(0) scale(0.45)"/><use href="#bow" transform="translate(1130 965) rotate(0) scale(0.45)"/><path class="d" d="M962.1 911.7L984.6 884.9A85 85 0 0 1 984.6 1015.1L962.1 988.3A50 50 0 0 0 962.1 911.7Z"/><text class="p" x="930" y="1035" text-anchor="middle">가까이서 벤다</text><text class="p" x="1130" y="1035" text-anchor="middle">멀리서 쏜다</text><path class="c" d="M1330 927 1343 940 1330 953 1317 940Z"/><circle class="c" cx="1330" cy="940" r="3"/><path class="g" d="M1330 908 1330 870"/><path class="g" d="M1334.3 877.9 1330.0 870.0 1325.7 877.9"/><path class="g" d="M1330 972 1330 1010"/><path class="g" d="M1325.7 1002.1 1330.0 1010.0 1334.3 1002.1"/><text class="p" x="1330" y="1040" text-anchor="middle">파고들고 빠진다</text><path class="c" d="M1560 927 1573 940 1560 953 1547 940Z"/><circle class="c" cx="1560" cy="940" r="3"/><path class="g" d="M1590 940 1650 940"/><path class="g" d="M1642.1 944.3 1650.0 940.0 1642.1 935.7"/><path class="g" d="M1530 940 1470 940"/><path class="g" d="M1477.9 935.7 1470.0 940.0 1477.9 944.3"/><text class="p" x="1560" y="1040" text-anchor="middle">사이 · 옆으로 이동</text><text class="s" x="900" y="1094" text-anchor="middle">색을 빼도 구별되어야 한다 · 저울대는 보스 본체의 일부이며 몹이 아니다 · 수치는 플레이 검증 대상</text></svg>